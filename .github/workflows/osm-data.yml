name: Fetch OSM streets of Turkestan
on:
  push:
    branches: [osm-data]
    paths: [.github/workflows/osm-data.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download from Overpass
        run: |
          mkdir -p osm
          Q='[out:json][timeout:180];(way["highway"]["highway"!~"footway|path|track|steps|cycleway|bridleway|construction|proposed|corridor|platform"](43.22,68.13,43.38,68.38);way["railway"="rail"](43.22,68.13,43.38,68.38);way["waterway"~"^(river|canal)$"](43.22,68.13,43.38,68.38););out tags geom;nwr["name"~"Ясави|Яссауи|Ясауи|Yasawi|Yassawi|Yasaw"](43.22,68.13,43.38,68.38);out center tags;'
          for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            if curl -sf -m 240 --data-urlencode "data=$Q" "$u" -o osm/turkestan.json && python3 -c "import json;d=json.load(open('osm/turkestan.json'));assert len(d['elements'])>100;print(len(d['elements']))"; then break; fi
          done
          ls -la osm
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add osm/turkestan.json
          git commit -m "OSM streets of Turkestan (© OpenStreetMap contributors, ODbL)"
          git push
